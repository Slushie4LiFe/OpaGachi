# Builds OpaGachi on GitHub's Windows machines with Windows' own C# compiler (no SDK).
# - Every push and pull request: builds the installer and keeps the zip as a downloadable artifact.
# - Publishing a release (tag vX.Y.Z, matching src\AssemblyInfo.cs): also attaches the zip to that release.
# Code signing (SignPath Foundation) goes between "Build" and "Attach" once the project is approved;
# see docs/TECHNICAL.md, "Code signing".
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# A release made in the browser can fire both the tag push and "release published": run them one after the other
# so their two zip uploads can't collide.
concurrency: build-${{ github.ref }}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # only used to attach the zip to a release
    steps:
      - uses: actions/checkout@v4

      - name: Build installer and zip
        shell: cmd
        run: package.cmd

      - name: Keep the zip
        uses: actions/upload-artifact@v4
        with:
          name: OpaGachi
          path: dist/OpaGachi-*.zip

      - name: Attach the zip to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = (Get-Item dist\OpaGachi-*.zip).FullName
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag $zip --clobber }
          else { gh release create $tag $zip --title "OpaGachi $tag" --notes-file CHANGELOG.md }
